<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0d1117" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="Rob Control" />
<meta name="mobile-web-app-capable" content="yes" />
<title>Rob Control</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="apple-touch-icon" href="icon-192.svg" />
<link rel="icon" type="image/svg+xml" sizes="192x192" href="icon-192.svg" />
<link rel="icon" type="image/svg+xml" sizes="512x512" href="icon-512.svg" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Rob <span>Control</span></h1>
    <div class="date-line" id="headerDate">—</div>
    <div class="sub">Today · Log · Library</div>
  </header>

  <main class="main">
    <!-- TODAY -->
    <section id="panel-today" class="panel active">
      <div class="meta-bar">
        <span id="todayCount">0 open</span>
        <button type="button" class="reimport" id="reimportBtn" title="Re-import seed">Re-import seed</button>
      </div>
      <div class="add-bar">
        <input class="input" id="todayInput" type="text" placeholder="Add task…" autocomplete="off" />
        <button type="button" class="btn btn-primary" id="todayAdd">Add</button>
      </div>
      <div id="todayOpen"></div>
      <div class="section-label">
        Done <span id="doneCount"></span>
        <button type="button" id="toggleDone">Show</button>
      </div>
      <div id="todayDone" class="collapsed"></div>
      <div class="row-actions" style="margin-top:1rem">
        <button type="button" class="btn btn-danger" id="endDayBtn">End day</button>
      </div>
    </section>

    <!-- LOG -->
    <section id="panel-log" class="panel">
      <div class="search-wrap">
        <input class="input" id="logSearch" type="search" placeholder="Search log…" autocomplete="off" />
      </div>
      <div class="add-bar">
        <input class="input" id="logNoteInput" type="text" placeholder="Note for a day…" autocomplete="off" />
        <button type="button" class="btn btn-primary" id="logAddNote">Add</button>
      </div>
      <div id="logList"></div>
      <div class="row-actions">
        <button type="button" class="btn btn-sm" id="logShowOlder" style="display:none">Show older</button>
      </div>
    </section>

    <!-- LIBRARY -->
    <section id="panel-library" class="panel">
      <div class="stub" id="libStub">
        Library stub (v1): Full MainDevice sheet import (hardware storage, Load List, supplies, Weight, Shredder, Deferred, Robisms, Dump, Past) comes next. Starter facts, ideas, links, and hardware are included now.
      </div>
      <div class="lib-tabs">
        <button type="button" class="lib-tab active" data-lib="facts">Facts</button>
        <button type="button" class="lib-tab" data-lib="ideas">Ideas</button>
        <button type="button" class="lib-tab" data-lib="links">Links</button>
        <button type="button" class="lib-tab" data-lib="hardware">Hardware</button>
      </div>
      <div class="add-bar" id="libAddBar">
        <input class="input" id="libInput" type="text" placeholder="Add…" autocomplete="off" />
        <button type="button" class="btn btn-primary" id="libAdd">Add</button>
      </div>
      <div id="lib-facts" class="lib-pane active"></div>
      <div id="lib-ideas" class="lib-pane"></div>
      <div id="lib-links" class="lib-pane"></div>
      <div id="lib-hardware" class="lib-pane"></div>
    </section>
  </main>

  <nav class="tab-nav" aria-label="Main">
    <button type="button" class="tab-btn active" data-tab="today">Today</button>
    <button type="button" class="tab-btn" data-tab="log">Log</button>
    <button type="button" class="tab-btn" data-tab="library">Library</button>
  </nav>

  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet"></div>
  </div>
  <div class="toast" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
